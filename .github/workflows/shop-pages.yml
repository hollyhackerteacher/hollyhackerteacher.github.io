name: Publish website and sync kit stock

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Offset from the start of the hour, when GitHub queues are often busiest.
    - cron: '2-59/5 * * * *'

permissions:
  contents: read

concurrency:
  group: shop-pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          # Fetch security releases instead of reusing an older runner cache.
          check-latest: true
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Read remaining stock from Stripe
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npm run sync-inventory
        env:
          STRIPE_INVENTORY_KEY: ${{ secrets.STRIPE_INVENTORY_KEY }}
      - name: Upload website only
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: upload
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
      # Remove this run's temporary upload after deployment to avoid accumulating
      # a full website artifact every five minutes. Source files are not changed.
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Remove the temporary upload after successful deployment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: gh api --method DELETE "repos/$REPOSITORY/actions/artifacts/$ARTIFACT_ID"
